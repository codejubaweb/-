<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JUBA | Full-Stack Developer</title>

    <!-- Content Security Policy (CSP) for Static Client-side Security -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://lh3.googleusercontent.com; connect-src 'self' https://generativelanguage.googleapis.com https://*.googleapis.com;" />

    <!-- Anti-Clickjacking Frame-Busting Protection -->
    <style id="antiClickjack">
      body { display: none !important; }
    </style>
    <script type="text/javascript">
      if (self === top) {
        var antiClickjack = document.getElementById("antiClickjack");
        if (antiClickjack && antiClickjack.parentNode) {
          antiClickjack.parentNode.removeChild(antiClickjack);
        }
      } else {
        top.location = self.location;
      }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  </head>
  <body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 selection:bg-neon/30 overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
